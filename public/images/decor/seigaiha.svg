<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="0 0 80 40">
  <defs>
    <g id="w" fill="none" stroke="#fff" stroke-width="1.6">
      <circle r="39" fill="#000"/>
      <circle r="31"/>
      <circle r="23"/>
      <circle r="15"/>
      <circle r="7"/>
      <circle r="39"/>
